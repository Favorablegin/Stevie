<body>
<header class="top">

    <svg class="alpaca" viewBox="0 0 64 64" aria-hidden="true"><use href="#alpaca"/></svg>

      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-arg="heute"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>Heute</button>
  <button data-act="tab" data-arg="protokoll"><svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-2 2-2-2-2 2-2-2-3 2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6"/></svg>Protokoll</button>
  <button data-act="tab" data-arg="muster"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><circle cx="18" cy="7" r="1.3"/></svg>Muster</button>

</div>

  <symbol id="alpaca" viewBox="0 0 64 64">
    <g fill="currentColor">
      <ellipse cx="22.5" cy="12" rx="3.6" ry="7.5" transform="rotate(-16 22.5 12)"/>

      <rect x="25" y="44" width="14" height="19" rx="5"/>
    </g>
    <circle cx="27" cy="31" r="2.3" fill="var(--eye, #1e1b17)"/>
    <circle cx="37" cy="31" r="2.3" fill="var(--eye, #1e1b17)"/>
    <ellipse cx="32" cy="41.5" rx="6.5" ry="4.6" fill="var(--muzzle, rgba(0,0,0,.12))"/>
    <path d="M30 41h4l-2 2z" fill="var(--eye, #1e1b17)"/>
  </symbol>
</svg>
