# Ruft abends alle 10 Minuten die Prüfung auf (Futterschale bis 19:30, 3 Tage ohne Session).
# Deckt Sommer- und Winterzeit ab; die Funktion selbst prüft die Berliner Uhrzeit und sendet pro Tag nur einmal.
name: Abend-Check
on:
  schedule:
    - cron: '*/10 16-20 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 https://stevie-ten.vercel.app/api/cron
